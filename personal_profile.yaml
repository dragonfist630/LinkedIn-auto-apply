  filters:
    sort_by: "Most relevant"              # "Most recent", "Most relevant", or ""
    date_posted: "Past 24 hours"          # "Any time", "Past month", "Past week", "Past 24 hours", or ""
    salary: ""
    easy_apply_only: true
    experience_level: []                  # "Internship", "Entry level", "Associate", "Mid-Senior level", "Director", "Executive"
